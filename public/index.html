<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>GemioERP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="navbtn" class="navbtn" title="功能表" aria-label="功能表">☰</button>
  <a href="#/" class="brand"><img src="icon.svg" alt=""><span>GemioERP</span></a>
  <span id="crumb" class="crumb"></span>
  <button id="net" class="net" title="連線狀態 / 待傳佇列"><i></i><span>連線中</span><b id="qn" hidden>0</b></button>
</header>
<div class="shell">
  <nav id="nav" class="nav" aria-label="主功能表"></nav>
  <main id="view"></main>
</div>
<dialog id="qdlg">
  <h3>待傳佇列</h3>
  <div id="qlist"></div>
  <div class="acts"><button id="qsend" class="pri">立即重傳</button><button onclick="qdlg.close()">關閉</button></div>
</dialog>
<dialog id="refdlg" class="wide">
  <h3></h3>
  <div class="tbl"></div>
  <div class="acts"><button id="refok" class="pri">帶入勾選資料</button><button onclick="refdlg.close()">取消</button></div>
</dialog>
<div id="toast" role="status"></div>
<script src="outbox.js"></script>
<script src="app.js"></script>
</body>
</html>
